# Render Blueprint: Averion API + document ingestion worker
# https://render.com/docs/blueprint-spec
#
# Import in Render Dashboard -> New -> Blueprint -> connect this repo.
# Set secret env vars in the dashboard after the blueprint is applied.

services:
  - type: web
    name: averion-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: AVERION_PROCESS
        value: api
      - key: INLINE_DOCUMENT_INGESTION
        value: "false"
      - key: DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: AUTH_REQUIRED
        value: "true"
      - key: EMBEDDING_MODEL_PRELOAD
        value: "false"
      - key: EMBEDDING_BATCH_SIZE
        value: "8"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_PROVIDER_API_KEY
        sync: false

  - type: worker
    name: averion-document-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    envVars:
      - key: AVERION_PROCESS
        value: worker
      - key: DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: EMBEDDING_MODEL_PRELOAD
        value: "true"
      - key: EMBEDDING_BATCH_SIZE
        value: "8"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_PROVIDER_API_KEY
        sync: false
