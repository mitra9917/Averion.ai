# Render Blueprint: Averion API + document ingestion worker
# Dashboard: New -> Blueprint -> connect GitHub repo

services:
  - type: web
    name: averion-api
    runtime: python
    rootDir: apps/api
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: AVERION_PROCESS
        value: api
      - key: INLINE_DOCUMENT_INGESTION
        value: "false"
      - key: DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: AUTH_REQUIRED
        value: "true"
      - key: EMBEDDING_MODEL_PRELOAD
        value: "false"
      - key: EMBEDDING_BATCH_SIZE
        value: "8"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_PROVIDER_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        sync: false

  - type: worker
    name: averion-document-worker
    runtime: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.document_ingestion
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: AVERION_PROCESS
        value: worker
      - key: DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: EMBEDDING_MODEL_PRELOAD
        value: "true"
      - key: EMBEDDING_BATCH_SIZE
        value: "8"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: MKL_NUM_THREADS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_PROVIDER_API_KEY
        sync: false
