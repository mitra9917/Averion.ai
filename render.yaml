# Public API stays on Render Free. ML inference and ingestion run in private AWS Lambda functions.

services:
  - type: web
    name: averion-api
    runtime: python
    rootDir: apps/api
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 30
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: INLINE_DOCUMENT_INGESTION
        value: "false"
      - key: ENABLE_DOCUMENT_INGESTION_DAEMON
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: aws_lambda
      - key: EMBEDDING_AWS_REGION
        value: ap-south-1
      - key: EMBEDDING_AWS_FUNCTION_NAME
        sync: false
      - key: DOCUMENT_WORKER_AWS_FUNCTION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_CONNECT_TIMEOUT
        value: "30"
      - key: DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: AUTH_REQUIRED
        value: "true"
      - key: EMBEDDING_MODEL_PRELOAD
        value: "false"
      - key: EMBEDDING_BATCH_SIZE
        value: "4"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: HF_HOME
        value: .cache/huggingface
      - key: SENTENCE_TRANSFORMERS_HOME
        value: .cache/sentence-transformers
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_PROVIDER_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        sync: false
